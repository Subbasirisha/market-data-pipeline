version: 2

sources:
  - name: raw
    description: Tables written by the Python load step (src/market_pipeline/load.py).
    schema: raw
    # Freshness: is new data still arriving? Checked with `dbt source freshness`.
    # A pipeline can "succeed" every hour while loading nothing, and this is what catches that.
    loaded_at_field: loaded_at
    tables:
      - name: crypto_prices
        description: One CoinGecko price point per coin, ~5 minutes apart.
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 6, period: hour}
        columns:
          - name: coin_id
            data_tests: [not_null]
          - name: price_ts
            data_tests: [not_null]
          - name: price_usd
            data_tests: [not_null, positive]
        data_tests:
          - unique_combination:
              arguments:
                columns: [coin_id, price_ts]

      - name: stock_prices_daily
        description: One Alpha Vantage daily bar per stock per trading day.
        freshness:
          # Markets close on weekends and holidays, so allow a long weekend.
          warn_after: {count: 4, period: day}
          error_after: {count: 6, period: day}
        columns:
          - name: close
            data_tests: [not_null, positive]
        data_tests:
          - unique_combination:
              arguments:
                columns: [symbol, trade_date]
