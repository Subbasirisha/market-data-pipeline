name: market
version: "1.0.0"
profile: market

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  market:
    # Staging: one view per raw table. Cheap (no storage) and always up to date.
    staging:
      +schema: staging
      +materialized: view
    # Marts: what analysts and dashboards query. Tables, so reads are fast.
    marts:
      +schema: marts
      +materialized: table
