[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-pipeline"
version = "0.1.0"
description = "Ingestion pipeline for crypto and stock market data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# dbt has many dependencies of its own, so it's an opt-in extra: pip install -e ".[dbt]"
dbt = [
    "dbt-postgres>=1.11",
]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (docker compose up -d); skipped otherwise",
]

[tool.ruff]
line-length = 100
